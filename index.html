<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Form Damage</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px 40px;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
  margin-bottom: 16px;
}

.header {
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 700;
}

.header p {
  margin: 6px 0 0;
  color: #777;
  font-size: 14px;
}

.form-group {
  margin-bottom: 17px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 600;
}

input,
textarea {
  width: 100%;
  border: 1px solid #d9dde2;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  outline: none;
  background: #fff;
}

input:focus,
textarea:focus {
  border-color: #222;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input[type="file"] {
  padding: 10px;
}

#preview {
  display: none;
  width: 100%;
  max-height: 240px;
  object-fit: contain;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 14px;
  background: #111;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 12px;
  padding: 11px;
  border-radius: 9px;
  font-size: 13px;
  text-align: center;
}

.status.success {
  display: block;
  background: #eaf8ee;
  color: #1c7c38;
}

.status.error {
  display: block;
  background: #fdecec;
  color: #b42318;
}


/* =====================================================
   BUTTON GOOGLE SPREADSHEET
   ===================================================== */

.spreadsheet-card {
  text-align: center;
}

.spreadsheet-title {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 700;
}

.spreadsheet-description {
  margin: 0 0 16px;
  color: #888;
  font-size: 13px;
  line-height: 1.5;
}

.spreadsheet-btn {
  display: block;
  width: 100%;
  border-radius: 11px;
  padding: 14px;
  background: #111;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  text-decoration: none;
  text-align: center;
  cursor: pointer;
}

.spreadsheet-btn:hover {
  background: #222;
}

.spreadsheet-btn:active {
  transform: scale(0.99);
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 380px) {

  .card {
    padding: 17px;
  }

}

</style>

</head>


<body>

<div class="container">


  <!-- ==================================================
       FORM INPUT
       ================================================== -->

  <div class="card">

    <div class="header">

      <h1>SS1004-XHKC 2026</h1>

      <p>
        Damage During Stock Take 2026
      </p>

    </div>


    <form id="damageForm">


      <!-- SKU -->

      <div class="form-group">

        <label for="sku">
          SKU
        </label>

        <input
          type="text"
          id="sku"
          name="sku"
          placeholder="Masukkan SKU"
          autocomplete="off"
          required
        >

      </div>


      <!-- GAMBAR -->

      <div class="form-group">

        <label for="image">
          Gambar Damage
        </label>

        <input
          type="file"
          id="image"
          name="image"
          accept="image/*"
          capture="environment"
          required
        >

        <img
          id="preview"
          alt="Preview gambar"
        >

      </div>


      <!-- QTY -->

      <div class="form-group">

        <label for="qty">
          QTY
        </label>

        <input
          type="number"
          id="qty"
          name="qty"
          min="1"
          placeholder="Masukkan QTY"
          required
        >

      </div>


      <!-- REASON -->

      <div class="form-group">

        <label for="reason">
          Reason
        </label>

        <textarea
          id="reason"
          name="reason"
          placeholder="Masukkan alasan damage"
          required
        ></textarea>

      </div>


      <button
        type="submit"
        id="submitBtn"
      >
        SIMPAN DATA
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </form>

  </div>



  <!-- ==================================================
       GOOGLE SPREADSHEET
       ================================================== -->

  <div class="card spreadsheet-card">

    <h2 class="spreadsheet-title">
      Data Damage
    </h2>

    <p class="spreadsheet-description">
      Untuk melihat data damage yang sudah tersimpan,
      buka Google Spreadsheet.
    </p>

    <a
      class="spreadsheet-btn"
      href="https://docs.google.com/spreadsheets/d/1TcyK-rBhLe2Ibn8iTot5KqdaLBoI4f6ZEWvLZOaHEvU/edit"
      target="_blank"
      rel="noopener noreferrer"
    >
      BUKA GOOGLE SPREADSHEET
    </a>

  </div>

</div>



<script>

/* =====================================================
   API
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw6mS8s89FS3sZ6Xa5ZqJorbqFxURs_XlCkPgC2kQUR2aIerj9DemZ-PU8hctLRO8EUng/exec";


/* =====================================================
   ELEMENT
   ===================================================== */

const form =
  document.getElementById("damageForm");

const imageInput =
  document.getElementById("image");

const preview =
  document.getElementById("preview");

const submitBtn =
  document.getElementById("submitBtn");

const statusBox =
  document.getElementById("status");


/* =====================================================
   PREVIEW IMAGE
   ===================================================== */

imageInput.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) {

      preview.style.display =
        "none";

      preview.src =
        "";

      return;

    }

    const reader =
      new FileReader();

    reader.onload =
      function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };

    reader.readAsDataURL(file);

  }
);


/* =====================================================
   COMPRESS IMAGE
   ===================================================== */

function compressImage(
  file,
  maxSize = 1200,
  quality = 0.75
) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          const img =
            new Image();

          img.onload =
            function() {

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                if (
                  width > height
                ) {

                  height =
                    height *
                    maxSize /
                    width;

                  width =
                    maxSize;

                }
                else {

                  width =
                    width *
                    maxSize /
                    height;

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;

}


/* =====================================================
   SUBMIT
   ===================================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    try {

      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "MENYIMPAN...";


      showStatus(
        "Sedang menyimpan data...",
        "success"
      );


      const sku =
        document
          .getElementById("sku")
          .value
          .trim();


      const qty =
        Number(
          document
            .getElementById("qty")
            .value
        );


      const reason =
        document
          .getElementById("reason")
          .value
          .trim();


      const imageFile =
        imageInput.files[0];


      if (!sku) {

        throw new Error(
          "SKU wajib diisi."
        );

      }


      if (
        !Number.isInteger(qty) ||
        qty <= 0
      ) {

        throw new Error(
          "QTY harus lebih dari 0."
        );

      }


      if (!reason) {

        throw new Error(
          "Reason wajib diisi."
        );

      }


      if (!imageFile) {

        throw new Error(
          "Gambar Damage wajib diupload."
        );

      }


      const imageBase64 =
        await compressImage(
          imageFile
        );


      const payload = {

        sku:
          sku,

        qty:
          qty,

        reason:
          reason,

        imageBase64:
          imageBase64

      };


      const response =
        await fetch(
          API_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const result =
        await response.json();


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          "Gagal menyimpan data."
        );

      }


      showStatus(
        "Data berhasil disimpan. No: " +
        result.no,
        "success"
      );


      form.reset();


      preview.src =
        "";

      preview.style.display =
        "none";


    }
    catch (error) {

      console.error(
        error
      );


      showStatus(
        error.message ||
        "Terjadi kesalahan.",
        "error"
      );

    }
    finally {

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "SIMPAN DATA";

    }

  }
);

</script>

</body>
</html>
