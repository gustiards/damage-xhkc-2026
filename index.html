
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Form Damage</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px 12px 40px;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
}

.card {
  background: #ffffff;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.06);
  margin-bottom: 16px;
}

.header {
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
  font-weight: 700;
}

.header p {
  margin: 6px 0 0;
  color: #777;
  font-size: 14px;
}

.form-group {
  margin-bottom: 17px;
}

.form-group label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 600;
}

input,
textarea {
  width: 100%;
  border: 1px solid #d9dde2;
  border-radius: 10px;
  padding: 12px;
  font-size: 15px;
  outline: none;
  background: #fff;
}

input:focus,
textarea:focus {
  border-color: #222;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

input[type="file"] {
  padding: 10px;
}

#preview {
  display: none;
  width: 100%;
  max-height: 240px;
  object-fit: contain;
  margin-top: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}

button {
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 14px;
  background: #111;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 12px;
  padding: 11px;
  border-radius: 9px;
  font-size: 13px;
  text-align: center;
}

.status.success {
  display: block;
  background: #eaf8ee;
  color: #1c7c38;
}

.status.error {
  display: block;
  background: #fdecec;
  color: #b42318;
}

.loading {
  text-align: center;
  color: #777;
  font-size: 14px;
  padding: 15px 0;
}

.empty {
  text-align: center;
  color: #888;
  font-size: 14px;
  padding: 20px 0;
}


/* =====================================================
   DATA DAMAGE
   ===================================================== */

.data-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.data-header h2 {
  margin: 0;
  font-size: 19px;
}

.data-header p {
  margin: 4px 0 0;
  color: #888;
  font-size: 12px;
}

.refresh-btn {
  width: auto;
  padding: 8px 13px;
  border-radius: 9px;
  background: #111;
  font-size: 18px;
  line-height: 1;
}


/* =====================================================
   ITEM DATA
   ===================================================== */

.damage-item {
  border: 1px solid #e5e7eb;
  border-radius: 13px;
  padding: 14px;
  margin-bottom: 10px;
  background: #fff;
}

.damage-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 11px;
}

.damage-no {
  font-size: 12px;
  color: #888;
}

.damage-sku {
  font-size: 16px;
  font-weight: 700;
  color: #111;
}

.damage-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

.info-box {
  background: #f7f8f9;
  border-radius: 9px;
  padding: 9px;
}

.info-label {
  display: block;
  font-size: 11px;
  color: #888;
  margin-bottom: 4px;
}

.info-value {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #222;
  word-break: break-word;
}

.reason-box {
  margin-top: 9px;
  background: #f7f8f9;
  border-radius: 9px;
  padding: 9px;
}

.amount {
  font-weight: 700;
}


/* =====================================================
   SUMMARY
   ===================================================== */

.summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}

.summary-box {
  border-radius: 13px;
  padding: 15px;
  background: #111;
  color: #fff;
}

.summary-label {
  display: block;
  font-size: 12px;
  opacity: 0.75;
  margin-bottom: 7px;
}

.summary-value {
  display: block;
  font-size: 20px;
  font-weight: 700;
  word-break: break-word;
}


/* =====================================================
   RESPONSIVE
   ===================================================== */

@media (max-width: 380px) {

  .card {
    padding: 17px;
  }

  .damage-info {
    grid-template-columns: 1fr;
  }

  .summary-value {
    font-size: 17px;
  }

}

</style>

</head>


<body>

<div class="container">


  <!-- ==================================================
       FORM INPUT
       ================================================== -->

  <div class="card">

    <div class="header">

      <h1>Form Damage</h1>

      <p>
        Input data barang damage
      </p>

    </div>


    <form id="damageForm">


      <!-- SKU -->

      <div class="form-group">

        <label for="sku">
          SKU
        </label>

        <input
          type="text"
          id="sku"
          name="sku"
          placeholder="Masukkan SKU"
          autocomplete="off"
          required
        >

      </div>


      <!-- GAMBAR -->

      <div class="form-group">

        <label for="image">
          Gambar Damage
        </label>

        <input
          type="file"
          id="image"
          name="image"
          accept="image/*"
          capture="environment"
          required
        >

        <img
          id="preview"
          alt="Preview gambar"
        >

      </div>


      <!-- QTY -->

      <div class="form-group">

        <label for="qty">
          QTY
        </label>

        <input
          type="number"
          id="qty"
          name="qty"
          min="1"
          placeholder="Masukkan QTY"
          required
        >

      </div>


      <!-- REASON -->

      <div class="form-group">

        <label for="reason">
          Reason
        </label>

        <textarea
          id="reason"
          name="reason"
          placeholder="Masukkan alasan damage"
          required
        ></textarea>

      </div>


      <button
        type="submit"
        id="submitBtn"
      >
        SIMPAN DATA
      </button>


      <div
        id="status"
        class="status"
      ></div>

    </form>

  </div>



  <!-- ==================================================
       DATA DAMAGE
       ================================================== -->

  <div class="card">

    <div class="data-header">

      <div>

        <h2>
          Data Damage
        </h2>

        <p>
          Daftar barang damage
        </p>

      </div>


      <button
        type="button"
        class="refresh-btn"
        onclick="loadData()"
        title="Refresh"
      >
        ↻
      </button>

    </div>


    <div
      id="dataLoading"
      class="loading"
    >
      Memuat data...
    </div>


    <div
      id="dataEmpty"
      class="empty"
      style="display:none;"
    >
      Belum ada data damage.
    </div>


    <div id="dataList"></div>


    <!-- ==================================================
         SUMMARY
         ================================================== -->

    <div
      id="summary"
      class="summary"
      style="display:none;"
    >

      <div class="summary-box">

        <span class="summary-label">
          Total SKU
        </span>

        <span
          id="totalSku"
          class="summary-value"
        >
          0
        </span>

      </div>


      <div class="summary-box">

        <span class="summary-label">
          Total Amount
        </span>

        <span
          id="totalAmount"
          class="summary-value"
        >
          Rp 0
        </span>

      </div>

    </div>

  </div>

</div>



<script>

/* =====================================================
   API
   ===================================================== */

const API_URL =
  "https://script.google.com/macros/s/AKfycbw6mS8s89FS3sZ6Xa5ZqJorbqFxURs_XlCkPgC2kQUR2aIerj9DemZ-PU8hctLRO8EUng/exec";


/* =====================================================
   ELEMENT
   ===================================================== */

const form =
  document.getElementById("damageForm");

const imageInput =
  document.getElementById("image");

const preview =
  document.getElementById("preview");

const submitBtn =
  document.getElementById("submitBtn");

const statusBox =
  document.getElementById("status");

const dataList =
  document.getElementById("dataList");

const dataLoading =
  document.getElementById("dataLoading");

const dataEmpty =
  document.getElementById("dataEmpty");

const summary =
  document.getElementById("summary");

const totalSku =
  document.getElementById("totalSku");

const totalAmount =
  document.getElementById("totalAmount");


/* =====================================================
   PREVIEW IMAGE
   ===================================================== */

imageInput.addEventListener(
  "change",
  function() {

    const file =
      this.files[0];

    if (!file) {

      preview.style.display =
        "none";

      preview.src =
        "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };


    reader.readAsDataURL(file);

  }
);


/* =====================================================
   COMPRESS IMAGE
   ===================================================== */

function compressImage(
  file,
  maxSize = 1200,
  quality = 0.75
) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onload =
        function(event) {

          const img =
            new Image();


          img.onload =
            function() {

              let width =
                img.width;

              let height =
                img.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                if (
                  width > height
                ) {

                  height =
                    height *
                    maxSize /
                    width;

                  width =
                    maxSize;

                }
                else {

                  width =
                    width *
                    maxSize /
                    height;

                  height =
                    maxSize;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(file);

    }
  );

}


/* =====================================================
   STATUS
   ===================================================== */

function showStatus(
  message,
  type
) {

  statusBox.textContent =
    message;

  statusBox.className =
    "status " + type;

}


/* =====================================================
   SUBMIT
   ===================================================== */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    try {

      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "MENYIMPAN...";


      showStatus(
        "Sedang menyimpan data...",
        "success"
      );


      const sku =
        document
          .getElementById("sku")
          .value
          .trim();


      const qty =
        Number(
          document
            .getElementById("qty")
            .value
        );


      const reason =
        document
          .getElementById("reason")
          .value
          .trim();


      const imageFile =
        imageInput.files[0];


      if (!sku) {

        throw new Error(
          "SKU wajib diisi."
        );

      }


      if (
        !Number.isInteger(qty) ||
        qty <= 0
      ) {

        throw new Error(
          "QTY harus lebih dari 0."
        );

      }


      if (!reason) {

        throw new Error(
          "Reason wajib diisi."
        );

      }


      if (!imageFile) {

        throw new Error(
          "Gambar Damage wajib diupload."
        );

      }


      const imageBase64 =
        await compressImage(
          imageFile
        );


      const payload = {

        sku:
          sku,

        qty:
          qty,

        reason:
          reason,

        imageBase64:
          imageBase64

      };


      const response =
        await fetch(
          API_URL,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                payload
              )
          }
        );


      const result =
        await response.json();


      if (
        !result.success
      ) {

        throw new Error(
          result.message ||
          "Gagal menyimpan data."
        );

      }


      showStatus(
        "Data berhasil disimpan. No: " +
        result.no,
        "success"
      );


      // Reset form
      form.reset();

      preview.src =
        "";

      preview.style.display =
        "none";


      // Refresh data
      await loadData();


    }
    catch (error) {

      console.error(
        error
      );


      showStatus(
        error.message ||
        "Terjadi kesalahan.",
        "error"
      );

    }
    finally {

      submitBtn.disabled =
        false;

      submitBtn.textContent =
        "SIMPAN DATA";

    }

  }
);


/* =====================================================
   FORMAT RUPIAH
   ===================================================== */

function formatRupiah(
  value
) {

  const number =
    Number(value) || 0;


  return new Intl.NumberFormat(
    "id-ID",
    {
      style:
        "currency",

      currency:
        "IDR",

      maximumFractionDigits:
        0
    }
  ).format(
    number
  );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   LOAD DATA
   ===================================================== */

async function loadData() {

  dataLoading.style.display =
    "block";

  dataEmpty.style.display =
    "none";

  dataList.innerHTML =
    "";

  summary.style.display =
    "none";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=list&t=" +
        Date.now(),
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    const result =
      await response.json();


    if (
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Data gagal diambil."
      );

    }


    const data =
      Array.isArray(result.data)
        ? result.data
        : [];


    dataLoading.style.display =
      "none";


    if (
      data.length === 0
    ) {

      dataEmpty.style.display =
        "block";

      summary.style.display =
        "none";

      return;

    }


    /* =================================================
       SORT DATA TERBARU
       ================================================= */

    data.sort(
      function(a, b) {

        return (
          Number(b.no || 0) -
          Number(a.no || 0)
        );

      }
    );


    /* =================================================
       HITUNG TOTAL
       ================================================= */

    let amountTotal =
      0;


    data.forEach(
      function(item) {

        /*
         * Harga Total dari kolom G
         *
         * Menghapus format:
         * Rp
         * titik
         * koma
         */

        let amount =
          item.hargaTotal;


        if (
          amount === undefined ||
          amount === null ||
          amount === ""
        ) {

          amount = 0;

        }


        if (
          typeof amount === "string"
        ) {

          amount =
            amount
              .replace(
                /Rp/gi,
                ""
              )
              .replace(
                /\./g,
                ""
              )
              .replace(
                /,/g,
                "."
              )
              .trim();

        }


        amount =
          Number(amount) || 0;


        amountTotal +=
          amount;

      }
    );


    /* =================================================
       RENDER LIST
       ================================================= */

    data.forEach(
      function(item) {

        const sku =
          escapeHTML(
            item.sku
          );


        const namaBarang =
          escapeHTML(
            item.namaBarang
          );


        const qty =
          escapeHTML(
            item.qty
          );


        const reason =
          escapeHTML(
            item.reason
          );


        const hargaTotalValue =
          Number(
            item.hargaTotal
          ) || 0;


        const itemElement =
          document.createElement(
            "div"
          );


        itemElement.className =
          "damage-item";


        itemElement.innerHTML = `

          <div class="damage-top">

            <div class="damage-sku">
              ${sku || "-"}
            </div>

            <div class="damage-no">
              No. ${escapeHTML(item.no)}
            </div>

          </div>


          <div class="damage-info">

            <div class="info-box">

              <span class="info-label">
                Nama Barang
              </span>

              <span class="info-value">
                ${namaBarang || "-"}
              </span>

            </div>


            <div class="info-box">

              <span class="info-label">
                QTY
              </span>

              <span class="info-value">
                ${qty || "0"}
              </span>

            </div>


            <div class="info-box">

              <span class="info-label">
                Harga Total
              </span>

              <span class="info-value amount">
                ${formatRupiah(hargaTotalValue)}
              </span>

            </div>

          </div>


          <div class="reason-box">

            <span class="info-label">
              Reason
            </span>

            <span class="info-value">
              ${reason || "-"}
            </span>

          </div>

        `;


        dataList.appendChild(
          itemElement
        );

      }
    );


    /* =================================================
       SUMMARY
       ================================================= */

    totalSku.textContent =
      data.length;


    totalAmount.textContent =
      formatRupiah(
        amountTotal
      );


    summary.style.display =
      "grid";


  }
  catch (error) {

    console.error(
      "LOAD DATA ERROR:",
      error
    );


    dataLoading.style.display =
      "none";


    dataEmpty.style.display =
      "block";


    dataEmpty.textContent =
      "Data gagal dimuat: " +
      error.message;


    summary.style.display =
      "none";

  }

}


/* =====================================================
   LOAD DATA SAAT HALAMAN DIBUKA
   ===================================================== */

loadData();

</script>

</body>
</html>
