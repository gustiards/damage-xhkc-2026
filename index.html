<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Form Damage</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.header {
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 6px 0 0;
  color: #6b7280;
  font-size: 14px;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
}

input,
textarea,
button {
  width: 100%;
  font-family: inherit;
}

input,
textarea {
  border: 1px solid #d1d5db;
  border-radius: 11px;
  padding: 13px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
textarea:focus {
  border-color: #111827;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.file-box {
  border: 2px dashed #d1d5db;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
}

.file-box input {
  border: 0;
  padding: 0;
}

.preview {
  display: none;
  margin-top: 12px;
}

.preview img {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
  border-radius: 12px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: #111827;
  color: white;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.loading {
  display: none;
  margin-top: 12px;
  text-align: center;
  font-size: 14px;
  color: #6b7280;
}

.small {
  font-size: 12px;
  color: #6b7280;
  margin-top: 5px;
}

</style>

</head>


<body>


<div class="container">

<div class="card">

<div class="header">

<h1>Form Damage</h1>

<p>Input laporan kerusakan barang</p>

</div>


<form id="damageForm">


<!-- SKU -->

<div class="form-group">

<label for="sku">
SKU
</label>

<input
  type="text"
  id="sku"
  placeholder="Masukkan SKU"
  autocomplete="off"
  required
>

</div>


<!-- GAMBAR -->

<div class="form-group">

<label>
Gambar Damage
</label>

<div class="file-box">

<input
  type="file"
  id="image"
  accept="image/*"
  capture="environment"
  required
>

<div class="small">
Ambil foto atau pilih gambar damage
</div>

<div
  class="preview"
  id="preview"
>

<img
  id="previewImage"
  alt="Preview"
>

</div>

</div>

</div>


<!-- QTY -->

<div class="form-group">

<label for="qty">
QTY
</label>

<input
  type="number"
  id="qty"
  min="1"
  step="1"
  placeholder="Masukkan jumlah"
  required
>

</div>


<!-- REASON -->

<div class="form-group">

<label for="reason">
Reason
</label>

<textarea
  id="reason"
  placeholder="Contoh: SOBEK, PECAH, RUSAK..."
  required
></textarea>

</div>


<button
  type="submit"
  id="submitButton"
>
SIMPAN DATA
</button>


<div
  class="loading"
  id="loading"
>
Menyimpan data...
</div>


<div
  class="status"
  id="status"
></div>


</form>

</div>

</div>


<script>


/*************************************************
 * APPS SCRIPT URL
 *************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycbw6mS8s89FS3sZ6Xa5ZqJorbqFxURs_XlCkPgC2kQUR2aIerj9DemZ-PU8hctLRO8EUng/exec";


/*************************************************
 * ELEMENT
 *************************************************/

const form =
document.getElementById("damageForm");

const skuInput =
document.getElementById("sku");

const imageInput =
document.getElementById("image");

const qtyInput =
document.getElementById("qty");

const reasonInput =
document.getElementById("reason");

const preview =
document.getElementById("preview");

const previewImage =
document.getElementById("previewImage");

const submitButton =
document.getElementById("submitButton");

const loading =
document.getElementById("loading");

const statusBox =
document.getElementById("status");


/*************************************************
 * PREVIEW GAMBAR
 *************************************************/

imageInput.addEventListener(
"change",
function() {

  const file = this.files[0];

  if (!file) {

    preview.style.display = "none";
    previewImage.src = "";

    return;

  }


  if (!file.type.startsWith("image/")) {

    showStatus(
      "File harus berupa gambar.",
      "error"
    );

    this.value = "";

    return;

  }


  // Bersihkan URL preview sebelumnya
  if (previewImage.dataset.url) {
    URL.revokeObjectURL(
      previewImage.dataset.url
    );
  }


  const url =
  URL.createObjectURL(file);


  previewImage.src = url;

  previewImage.dataset.url = url;

  preview.style.display = "block";


  // Hilangkan pesan error
  statusBox.className = "status";
  statusBox.textContent = "";

});


/*************************************************
 * SUBMIT FORM
 *************************************************/

form.addEventListener(
"submit",
async function(event) {

  event.preventDefault();


  // --------------------------------------------
  // AMBIL DATA
  // --------------------------------------------

  const sku =
  skuInput.value.trim();

  const qty =
  Number(qtyInput.value);

  const reason =
  reasonInput.value.trim();

  const file =
  imageInput.files[0];


  // --------------------------------------------
  // VALIDASI SKU
  // --------------------------------------------

  if (!sku) {

    showStatus(
      "SKU wajib diisi.",
      "error"
    );

    skuInput.focus();

    return;

  }


  // --------------------------------------------
  // VALIDASI QTY
  // --------------------------------------------

  if (
    !Number.isInteger(qty) ||
    qty <= 0
  ) {

    showStatus(
      "QTY harus berupa angka lebih dari 0.",
      "error"
    );

    qtyInput.focus();

    return;

  }


  // --------------------------------------------
  // VALIDASI REASON
  // --------------------------------------------

  if (!reason) {

    showStatus(
      "Reason wajib diisi.",
      "error"
    );

    reasonInput.focus();

    return;

  }


  // --------------------------------------------
  // VALIDASI GAMBAR
  // --------------------------------------------

  if (!file) {

    showStatus(
      "Gambar Damage wajib diupload.",
      "error"
    );

    return;

  }


  try {

    setLoading(true);


    showStatus(
      "",
      ""
    );


    // ------------------------------------------
    // COMPRESS GAMBAR
    // ------------------------------------------

    const imageBase64 =
    await compressImage(file);


    // ------------------------------------------
    // PAYLOAD
    // ------------------------------------------

    const payload = {

      sku: sku,

      qty: qty,

      reason: reason,

      imageBase64: imageBase64

    };


    console.log(
      "Mengirim data:",
      {
        sku: sku,
        qty: qty,
        reason: reason,
        imageSize: imageBase64.length
      }
    );


    // ------------------------------------------
    // KIRIM KE APPS SCRIPT
    // ------------------------------------------

    const response =
    await fetch(
      API_URL,
      {

        method: "POST",

        headers: {

          "Content-Type":
          "text/plain;charset=utf-8"

        },

        body:
        JSON.stringify(payload)

      }
    );


    // ------------------------------------------
    // CEK HTTP RESPONSE
    // ------------------------------------------

    if (!response.ok) {

      throw new Error(
        "Server mengembalikan HTTP " +
        response.status
      );

    }


    // ------------------------------------------
    // BACA RESPONSE
    // ------------------------------------------

    const result =
    await response.json();


    console.log(
      "Response Apps Script:",
      result
    );


    // ------------------------------------------
    // CEK HASIL APPS SCRIPT
    // ------------------------------------------

    if (!result.success) {

      throw new Error(
        result.message ||
        "Data gagal disimpan."
      );

    }


    // ------------------------------------------
    // NOMOR DATA
    // ------------------------------------------

    const nomor =
    result.no ??
    result.data?.no ??
    "-";


    // ------------------------------------------
    // BERHASIL
    // ------------------------------------------

    showStatus(

      "✓ Data berhasil disimpan. No: " +
      nomor,

      "success"

    );


    // ------------------------------------------
    // RESET FORM
    // ------------------------------------------

    form.reset();


    preview.style.display =
    "none";


    if (previewImage.dataset.url) {

      URL.revokeObjectURL(
        previewImage.dataset.url
      );

    }


    previewImage.src = "";

    previewImage.dataset.url = "";


    // Kembalikan fokus ke SKU
    skuInput.focus();


  }
  catch(error) {

    console.error(
      "ERROR:",
      error
    );


    showStatus(

      error.message ||
      "Terjadi kesalahan saat menyimpan data.",

      "error"

    );

  }
  finally {

    setLoading(false);

  }

});


/*************************************************
 * COMPRESS GAMBAR
 *************************************************/

function compressImage(file) {

  return new Promise(
  function(resolve, reject) {

    const reader =
    new FileReader();


    reader.onload =
    function(event) {

      const img =
      new Image();


      img.onload =
      function() {

        let width =
        img.width;

        let height =
        img.height;


        // Ukuran maksimal
        const maxSize =
        1200;


        // --------------------------------------
        // RESIZE
        // --------------------------------------

        if (
          width > maxSize ||
          height > maxSize
        ) {

          if (width > height) {

            height =
            Math.round(
              height *
              maxSize /
              width
            );

            width =
            maxSize;

          }
          else {

            width =
            Math.round(
              width *
              maxSize /
              height
            );

            height =
            maxSize;

          }

        }


        // --------------------------------------
        // CANVAS
        // --------------------------------------

        const canvas =
        document.createElement(
          "canvas"
        );


        canvas.width =
        width;

        canvas.height =
        height;


        const ctx =
        canvas.getContext(
          "2d"
        );


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        // --------------------------------------
        // JPEG
        // --------------------------------------

        const result =
        canvas.toDataURL(
          "image/jpeg",
          0.75
        );


        resolve(result);

      };


      img.onerror =
      function() {

        reject(
          new Error(
            "Gambar tidak dapat diproses."
          )
        );

      };


      img.src =
      event.target.result;

    };


    reader.onerror =
    function() {

      reject(
        new Error(
          "Gagal membaca file gambar."
        )
      );

    };


    reader.readAsDataURL(file);

  });

}


/*************************************************
 * LOADING
 *************************************************/

function setLoading(isLoading) {

  submitButton.disabled =
  isLoading;


  loading.style.display =
  isLoading
    ? "block"
    : "none";


  submitButton.textContent =
  isLoading
    ? "MENYIMPAN..."
    : "SIMPAN DATA";

}


/*************************************************
 * STATUS
 *************************************************/

function showStatus(
message,
type
) {

  if (!message) {

    statusBox.textContent = "";
    statusBox.className = "status";

    return;

  }


  statusBox.textContent =
  message;


  statusBox.className =
  "status " + type;

}

</script>

</body>

</html>
