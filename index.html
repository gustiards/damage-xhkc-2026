<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Form Damage</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f8;
  color: #1f2937;
}

.container {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

.header {
  margin-bottom: 22px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 6px 0 0;
  color: #6b7280;
  font-size: 14px;
}

.form-group {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-size: 14px;
  font-weight: 700;
}

input,
textarea,
button {
  width: 100%;
  font-family: inherit;
}

input,
textarea {
  border: 1px solid #d1d5db;
  border-radius: 11px;
  padding: 13px;
  font-size: 15px;
  outline: none;
  background: white;
}

input:focus,
textarea:focus {
  border-color: #111827;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

.file-box {
  border: 2px dashed #d1d5db;
  border-radius: 14px;
  padding: 18px;
  text-align: center;
}

.file-box input {
  border: 0;
  padding: 0;
}

.preview {
  display: none;
  margin-top: 12px;
}

.preview img {
  width: 100%;
  max-height: 250px;
  object-fit: cover;
  border-radius: 12px;
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: #111827;
  color: white;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.status {
  display: none;
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  font-size: 14px;
}

.status.success {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.status.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.loading {
  display: none;
  margin-top: 12px;
  text-align: center;
  font-size: 14px;
  color: #6b7280;
}

.small {
  font-size: 12px;
  color: #6b7280;
  margin-top: 5px;
}


/* ==================================================
   VIEW DATA
================================================== */

.data-card {
  margin-top: 18px;
}

.data-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.data-header h2 {
  margin: 0;
  font-size: 20px;
}

.data-header p {
  margin: 5px 0 0;
  color: #6b7280;
  font-size: 13px;
}


/* ==================================================
   REFRESH BUTTON
================================================== */

.refresh-button {
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 10px;
  font-size: 22px;
  line-height: 42px;
}


/* ==================================================
   DATA LOADING
================================================== */

.data-loading {
  display: none;
  text-align: center;
  padding: 20px;
  color: #6b7280;
  font-size: 13px;
}


/* ==================================================
   EMPTY
================================================== */

.data-empty {
  display: none;
  text-align: center;
  padding: 25px 10px;
  color: #9ca3af;
  font-size: 13px;
}


/* ==================================================
   DATA LIST
================================================== */

.data-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}


/* ==================================================
   DATA ITEM
================================================== */

.data-item {
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 12px;
  background: #fafafa;
}


/* ==================================================
   TOP DATA
================================================== */

.data-main {
  display: flex;
  gap: 12px;
}


/* ==================================================
   IMAGE
================================================== */

.data-image {
  width: 95px;
  height: 95px;
  min-width: 95px;
  border-radius: 11px;
  object-fit: cover;
  background: #e5e7eb;
  display: block;
}


/* ==================================================
   IMAGE PLACEHOLDER
================================================== */

.data-image-placeholder {
  width: 95px;
  height: 95px;
  min-width: 95px;
  border-radius: 11px;
  background: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #9ca3af;
  font-size: 11px;
  text-align: center;
}


/* ==================================================
   DATA CONTENT
================================================== */

.data-content {
  flex: 1;
  min-width: 0;
}


/* ==================================================
   NO
================================================== */

.data-no {
  font-size: 11px;
  color: #6b7280;
  font-weight: 700;
  margin-bottom: 4px;
}


/* ==================================================
   SKU
================================================== */

.data-sku {
  font-size: 16px;
  font-weight: 700;
  color: #111827;
  word-break: break-word;
}


/* ==================================================
   INFO
================================================== */

.data-info {
  display: grid;
  grid-template-columns: 1fr;
  gap: 7px;
  margin-top: 12px;
}

.data-info-box {
  background: white;
  border-radius: 9px;
  padding: 9px;
  border: 1px solid #f0f0f0;
}

.data-label {
  font-size: 10px;
  color: #9ca3af;
  margin-bottom: 3px;
  font-weight: 700;
}

.data-value {
  font-size: 13px;
  font-weight: 700;
  color: #374151;
  word-break: break-word;
}


/* ==================================================
   REASON
================================================== */

.data-reason {
  margin-top: 8px;
  background: white;
  border: 1px solid #f0f0f0;
  border-radius: 9px;
  padding: 9px;
}

.data-reason-text {
  font-size: 13px;
  color: #374151;
  word-break: break-word;
  white-space: pre-wrap;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 380px) {

  .container {
    padding: 12px;
  }

  .card {
    padding: 17px;
  }

  .data-image,
  .data-image-placeholder {
    width: 80px;
    height: 80px;
    min-width: 80px;
  }

}

</style>

</head>


<body>


<div class="container">


<!-- ==================================================
     FORM
================================================== -->

<div class="card">

<div class="header">

<h1>Form Damage</h1>

<p>Input laporan kerusakan barang</p>

</div>


<form id="damageForm">


<!-- SKU -->

<div class="form-group">

<label for="sku">
SKU
</label>

<input
  type="text"
  id="sku"
  placeholder="Masukkan SKU"
  autocomplete="off"
  required
>

</div>


<!-- GAMBAR -->

<div class="form-group">

<label>
Gambar Damage
</label>

<div class="file-box">

<input
  type="file"
  id="image"
  accept="image/*"
  capture="environment"
  required
>

<div class="small">
Ambil foto atau pilih gambar damage
</div>


<div
  class="preview"
  id="preview"
>

<img
  id="previewImage"
  alt="Preview"
>

</div>

</div>

</div>


<!-- QTY -->

<div class="form-group">

<label for="qty">
QTY
</label>

<input
  type="number"
  id="qty"
  min="1"
  step="1"
  placeholder="Masukkan jumlah"
  required
>

</div>


<!-- REASON -->

<div class="form-group">

<label for="reason">
Reason
</label>

<textarea
  id="reason"
  placeholder="Contoh: SOBEK, PECAH, RUSAK..."
  required
></textarea>

</div>


<button
  type="submit"
  id="submitButton"
>
SIMPAN DATA
</button>


<div
  class="loading"
  id="loading"
>
Menyimpan data...
</div>


<div
  class="status"
  id="status"
></div>


</form>

</div>


<!-- ==================================================
     VIEW DATA
================================================== -->

<div class="card data-card">


<div class="data-header">

<div>

<h2>
Data Damage
</h2>

<p>
Data yang sudah berhasil diinput
</p>

</div>


<button
  type="button"
  class="refresh-button"
  id="refreshButton"
  title="Refresh data"
>
↻
</button>

</div>


<div
  class="data-loading"
  id="dataLoading"
>
Memuat data...
</div>


<div
  class="data-empty"
  id="dataEmpty"
>
Belum ada data.
</div>


<div
  class="data-list"
  id="dataList"
></div>


</div>


</div>


<script>


// ==================================================
// API
// ==================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbw6mS8s89FS3sZ6Xa5ZqJorbqFxURs_XlCkPgC2kQUR2aIerj9DemZ-PU8hctLRO8EUng/exec";


// ==================================================
// FORM ELEMENT
// ==================================================

const form =
document.getElementById("damageForm");

const skuInput =
document.getElementById("sku");

const imageInput =
document.getElementById("image");

const qtyInput =
document.getElementById("qty");

const reasonInput =
document.getElementById("reason");

const preview =
document.getElementById("preview");

const previewImage =
document.getElementById("previewImage");

const submitButton =
document.getElementById("submitButton");

const loading =
document.getElementById("loading");

const statusBox =
document.getElementById("status");


// ==================================================
// VIEW DATA ELEMENT
// ==================================================

const dataList =
document.getElementById("dataList");

const dataLoading =
document.getElementById("dataLoading");

const dataEmpty =
document.getElementById("dataEmpty");

const refreshButton =
document.getElementById("refreshButton");


// ==================================================
// PREVIEW
// ==================================================

imageInput.addEventListener(
"change",
function() {

  const file =
    this.files[0];


  if (!file) {

    preview.style.display =
      "none";

    previewImage.src =
      "";

    return;

  }


  if (!file.type.startsWith("image/")) {

    showStatus(
      "File harus berupa gambar.",
      "error"
    );

    this.value = "";

    return;

  }


  const url =
    URL.createObjectURL(file);


  previewImage.src =
    url;


  preview.style.display =
    "block";

});


// ==================================================
// SUBMIT
// ==================================================

form.addEventListener(
"submit",
async function(event) {

  event.preventDefault();


  const sku =
    skuInput.value.trim();


  const qty =
    Number(
      qtyInput.value
    );


  const reason =
    reasonInput.value.trim();


  const file =
    imageInput.files[0];


  // ================================================
  // VALIDASI SKU
  // ================================================

  if (!sku) {

    showStatus(
      "SKU wajib diisi.",
      "error"
    );

    skuInput.focus();

    return;

  }


  // ================================================
  // VALIDASI QTY
  // ================================================

  if (
    !Number.isInteger(qty) ||
    qty <= 0
  ) {

    showStatus(
      "QTY harus lebih dari 0.",
      "error"
    );

    qtyInput.focus();

    return;

  }


  // ================================================
  // VALIDASI REASON
  // ================================================

  if (!reason) {

    showStatus(
      "Reason wajib diisi.",
      "error"
    );

    reasonInput.focus();

    return;

  }


  // ================================================
  // VALIDASI GAMBAR
  // ================================================

  if (!file) {

    showStatus(
      "Gambar Damage wajib diupload.",
      "error"
    );

    return;

  }


  try {

    setLoading(true);


    // ==============================================
    // COMPRESS IMAGE
    // ==============================================

    const imageBase64 =
      await compressImage(file);


    // ==============================================
    // PAYLOAD
    // ==============================================

    const payload = {

      sku:
        sku,

      qty:
        qty,

      reason:
        reason,

      imageBase64:
        imageBase64

    };


    console.log(
      "Mengirim:",
      payload
    );


    // ==============================================
    // POST
    // ==============================================

    const response =
      await fetch(
        API_URL,
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify(
              payload
            )

        }
      );


    const result =
      await response.json();


    console.log(
      "Response:",
      result
    );


    // ==============================================
    // RESPONSE ERROR
    // ==============================================

    if (!result.success) {

      throw new Error(
        result.message ||
        "Data gagal disimpan."
      );

    }


    // ==============================================
    // BERHASIL
    // ==============================================

    showStatus(

      "✓ Data berhasil disimpan. No: " +
      result.no,

      "success"

    );


    // ==============================================
    // RESET FORM
    // ==============================================

    form.reset();


    preview.style.display =
      "none";


    previewImage.src =
      "";


    skuInput.focus();


    // ==============================================
    // REFRESH VIEW DATA
    // ==============================================

    await loadData();


  }
  catch(error) {

    console.error(
      "ERROR:",
      error
    );


    showStatus(

      error.message ||
      "Terjadi kesalahan.",

      "error"

    );

  }
  finally {

    setLoading(false);

  }

});


// ==================================================
// COMPRESS IMAGE
// ==================================================

function compressImage(file) {

  return new Promise(
  function(resolve, reject) {

    const reader =
      new FileReader();


    reader.onload =
      function(event) {

        const img =
          new Image();


        img.onload =
          function() {

            let width =
              img.width;


            let height =
              img.height;


            const maxSize =
              1200;


            if (
              width > maxSize ||
              height > maxSize
            ) {

              if (
                width > height
              ) {

                height =
                  Math.round(
                    height *
                    maxSize /
                    width
                  );


                width =
                  maxSize;

              }
              else {

                width =
                  Math.round(
                    width *
                    maxSize /
                    height
                  );


                height =
                  maxSize;

              }

            }


            const canvas =
              document.createElement(
                "canvas"
              );


            canvas.width =
              width;


            canvas.height =
              height;


            const ctx =
              canvas.getContext(
                "2d"
              );


            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );


            const result =
              canvas.toDataURL(
                "image/jpeg",
                0.75
              );


            resolve(
              result
            );

          };


        img.onerror =
          function() {

            reject(
              new Error(
                "Gambar gagal diproses."
              )
            );

          };


        img.src =
          event.target.result;

      };


    reader.onerror =
      function() {

        reject(
          new Error(
            "Gagal membaca gambar."
          )
        );

      };


    reader.readAsDataURL(
      file
    );

  });

}


// ==================================================
// LOAD DATA
// ==================================================

async function loadData() {

  dataLoading.style.display =
    "block";


  dataEmpty.style.display =
    "none";


  dataList.innerHTML =
    "";


  try {

    const response =
      await fetch(
        API_URL +
        "?action=list&t=" +
        Date.now(),
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Server mengembalikan HTTP " +
        response.status
      );

    }


    const result =
      await response.json();


    console.log(
      "View Data:",
      result
    );


    if (!result.success) {

      throw new Error(
        result.message ||
        "Gagal mengambil data."
      );

    }


    const data =
      Array.isArray(
        result.data
      )
        ? result.data
        : [];


    // ==============================================
    // TIDAK ADA DATA
    // ==============================================

    if (
      data.length === 0
    ) {

      dataEmpty.style.display =
        "block";

      dataEmpty.textContent =
        "Belum ada data damage.";

      return;

    }


    // ==============================================
    // DATA TERBARU DI ATAS
    // ==============================================

    data.sort(
      function(a, b) {

        return (
          Number(b.no || 0) -
          Number(a.no || 0)
        );

      }
    );


    // ==============================================
    // RENDER
    // ==============================================

    data.forEach(
      function(item) {

        const element =
          document.createElement(
            "div"
          );


        element.className =
          "data-item";


        const imageUrl =
          item.imageUrl ||
          "";


        let imageHTML;


        if (imageUrl) {

          imageHTML = `

            <img
              class="data-image"
              src="${escapeHTML(imageUrl)}"
              alt="Damage ${escapeHTML(item.sku)}"
              loading="lazy"
              onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
            >

            <div
              class="data-image-placeholder"
              style="display:none;"
            >
              Gambar tidak tersedia
            </div>

          `;

        }
        else {

          imageHTML = `

            <div
              class="data-image-placeholder"
            >
              Tidak ada gambar
            </div>

          `;

        }


        element.innerHTML = `

          <div class="data-main">

            ${imageHTML}


            <div class="data-content">

              <div class="data-no">
                NO. ${escapeHTML(item.no)}
              </div>


              <div class="data-sku">
                ${escapeHTML(item.sku)}
              </div>


              <div class="data-info">

                <div class="data-info-box">

                  <div class="data-label">
                    QTY
                  </div>

                  <div class="data-value">
                    ${escapeHTML(item.qty)}
                  </div>

                </div>

              </div>

            </div>

          </div>


          <div class="data-reason">

            <div class="data-label">
              REASON
            </div>

            <div class="data-reason-text">
              ${escapeHTML(item.reason)}
            </div>

          </div>

        `;


        dataList.appendChild(
          element
        );

      }
    );


  }
  catch(error) {

    console.error(
      "VIEW DATA ERROR:",
      error
    );


    dataEmpty.style.display =
      "block";


    dataEmpty.textContent =
      "Gagal mengambil data. " +
      error.message;

  }
  finally {

    dataLoading.style.display =
      "none";

  }

}


// ==================================================
// REFRESH
// ==================================================

refreshButton.addEventListener(
  "click",
  async function() {

    refreshButton.disabled =
      true;


    refreshButton.textContent =
      "⟳";


    try {

      await loadData();

    }
    finally {

      refreshButton.disabled =
        false;

      refreshButton.textContent =
        "↻";

    }

  }
);


// ==================================================
// ESCAPE HTML
// ==================================================

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


// ==================================================
// LOADING FORM
// ==================================================

function setLoading(
  isLoading
) {

  submitButton.disabled =
    isLoading;


  loading.style.display =
    isLoading
      ? "block"
      : "none";


  submitButton.textContent =
    isLoading
      ? "MENYIMPAN..."
      : "SIMPAN DATA";

}


// ==================================================
// STATUS
// ==================================================

function showStatus(
  message,
  type
) {

  if (!message) {

    statusBox.textContent =
      "";

    statusBox.className =
      "status";

    return;

  }


  statusBox.textContent =
    message;


  statusBox.className =
    "status " +
    type;

}


// ==================================================
// INITIAL LOAD
// ==================================================

loadData();

</script>

</body>

</html>
